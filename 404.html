<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 - Page Not Found | Stackly Haute Couture Atelier</title>
  <meta name="description" content="The requested page was not found on Stackly Haute Couture Atelier.">
  <link rel="icon" type="image/webp" href="assets/top-logo.webp">

  <!-- Typography & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    /* Full screen container */
    .error-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, rgba(194, 136, 0, 0.08) 0%, rgba(15, 23, 42, 0.03) 70%, transparent 100%);
    }

    /* Animated background glow orbs */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.55;
      pointer-events: none;
    }
    .bg-orb-1 {
      width: 350px;
      height: 350px;
      background: rgba(194, 136, 0, 0.25);
      top: 10%;
      left: 10%;
      animation: floatOrb 10s ease-in-out infinite alternate;
    }
    .bg-orb-2 {
      width: 400px;
      height: 400px;
      background: rgba(217, 119, 6, 0.18);
      bottom: 10%;
      right: 12%;
      animation: floatOrb 14s ease-in-out infinite alternate-reverse;
    }
    .bg-orb-3 {
      width: 260px;
      height: 260px;
      background: rgba(146, 64, 14, 0.15);
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulseGlow 5s ease-in-out infinite alternate;
    }

    /* Floating geometric icon accents */
    .floating-shape {
      position: absolute;
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }
    .shape-1 {
      top: 15%;
      right: 15%;
      font-size: 3rem;
      color: var(--gold-primary);
      animation: rotateFloat 18s linear infinite;
    }
    .shape-2 {
      bottom: 18%;
      left: 12%;
      font-size: 2.5rem;
      color: var(--gold-dark);
      animation: floatY 6s ease-in-out infinite alternate;
    }

    /* 404 Central Card */
    .error-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-card);
      border-radius: 24px;
      padding: 50px 40px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.1), 0 0 35px rgba(194, 136, 0, 0.12);
      position: relative;
      z-index: 10;
      text-align: center;
      animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Animated gradient accent bar on top */
    .error-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold-primary), var(--gold-light), var(--gold-primary), var(--gold-dark));
      background-size: 200% 100%;
      animation: gradientShift 4s linear infinite;
    }

    /* Avatar preview image & animated ring */
    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 24px;
    }

    .error-img-preview {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--gold-primary);
      box-shadow: 0 8px 25px rgba(194, 136, 0, 0.3);
      animation: avatarFloat 4s ease-in-out infinite;
      position: relative;
      z-index: 2;
    }

    .avatar-ring {
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border: 2px dashed rgba(194, 136, 0, 0.45);
      border-radius: 50%;
      animation: spinRing 16s linear infinite;
      z-index: 1;
    }

    /* Shimmering 404 Text */
    .error-code {
      font-size: 5.8rem;
      font-weight: 800;
      line-height: 1;
      font-family: var(--font-heading);
      background: linear-gradient(135deg, #1e293b 0%, var(--gold-primary) 50%, #d97706 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: -2px;
      animation: textShimmer 4s ease infinite;
    }

    /* Badge Tag */
    .solonick-tag-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-primary);
      background: rgba(194, 136, 0, 0.1);
      padding: 6px 16px;
      border-radius: 30px;
      border: 1px solid rgba(194, 136, 0, 0.25);
      margin-bottom: 16px;
    }

    /* Custom animated buttons */
    .btn-404-primary {
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-light));
      color: #ffffff !important;
      border: none;
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(194, 136, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .btn-404-primary:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 10px 28px rgba(194, 136, 0, 0.45);
    }

    .btn-404-primary:active {
      transform: translateY(-1px) scale(0.99);
    }

    .btn-404-primary i {
      transition: transform 0.3s ease;
    }

    .btn-404-primary:hover i {
      transform: translateX(-4px);
    }

    .btn-404-secondary {
      background: rgba(15, 23, 42, 0.05);
      color: var(--text-dark) !important;
      border: 1px solid var(--border-medium);
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .btn-404-secondary:hover {
      background: #0f172a;
      color: #ffffff !important;
      border-color: #0f172a;
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
    }

    .btn-404-secondary:active {
      transform: translateY(-1px) scale(0.99);
    }

    .btn-404-secondary i {
      transition: transform 0.3s ease;
    }

    .btn-404-secondary:hover i {
      transform: scale(1.15);
    }

    /* Keyframes */
    @keyframes cardEntrance {
      0% {
        opacity: 0;
        transform: translateY(35px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes avatarFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes spinRing {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes floatOrb {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(35px, 25px) scale(1.12);
      }
    }

    @keyframes pulseGlow {
      0% {
        opacity: 0.3;
        transform: translate(-50%, -50%) scale(0.95);
      }
      100% {
        opacity: 0.65;
        transform: translate(-50%, -50%) scale(1.18);
      }
    }

    @keyframes rotateFloat {
      0% {
        transform: rotate(0deg) translateY(0);
      }
      50% {
        transform: rotate(180deg) translateY(-15px);
      }
      100% {
        transform: rotate(360deg) translateY(0);
      }
    }

    @keyframes floatY {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-18px);
      }
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 200% 50%;
      }
    }

    @keyframes textShimmer {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* Responsive styling */
    @media (max-width: 576px) {
      .error-card {
        padding: 36px 24px;
        border-radius: 20px;
      }
      .error-code {
        font-size: 4.5rem;
      }
      .btn-container {
        flex-direction: column;
        width: 100%;
      }
      .btn-404-primary, .btn-404-secondary {
        width: 100%;
      }
    }
  </style>
</head>
<body class="bg-architectural-grid">

  <!-- STACKLY HAUTE COUTURE PRELOADER ENGINE (Guaranteed < 2s Load) -->
  <div id="stackly-preloader" aria-label="Loading Page" role="status">
    <div class="preloader-backdrop"></div>
    <div class="preloader-content">
      <div class="preloader-circle-wrapper">
        <div class="circle-ring ring-outer-spin"></div>
        <div class="circle-ring ring-middle-pulse"></div>
        <div class="circle-ring ring-inner-orbit">
          <span class="orbit-dot"></span>
          <span class="orbit-dot orbit-dot-secondary"></span>
        </div>
        <div class="preloader-logo-box">
          <img src="assets/top-logo.webp" alt="Stackly Atelier" class="preloader-logo-img">
        </div>
      </div>
      <div class="preloader-brand-title">
        <span class="brand-name">STACKLY</span>
        <span class="brand-sub">HAUTE COUTURE & BESPOKE ATELIER</span>
      </div>
      <div class="preloader-bar-container">
        <div class="preloader-progress-track">
          <div class="preloader-progress-fill" id="preloader-progress-fill"></div>
        </div>
        <div class="preloader-meta d-flex justify-content-between align-items-center mt-2">
          <span id="preloader-status-text">INITIALIZING ATELIER ENVIRONMENT...</span>
          <span class="preloader-pct-badge"><span id="preloader-pct-num">0</span>%</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Ambient Animated Background Lights -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <!-- Decorative Floating Accents -->
  <i class="fa-solid fa-scissors floating-shape shape-1"></i>
  <i class="fa-solid fa-compass floating-shape shape-2"></i>

  <!-- Main Viewport Section -->
  <main class="error-wrapper">
    <div class="error-card">
      <div class="avatar-wrapper">
        <div class="avatar-ring"></div>
        <img src="assets/images/pexels-pavel-danilyuk-6461201.webp" alt="Stackly Atelier" class="error-img-preview">
      </div>
      
      <span class="solonick-tag-badge">Page Not Found</span>
      <div class="error-code">404</div>
      <h1 class="h3 fw-bold text-dark mb-2">Looks Like You're Lost</h1>
      <p class="text-secondary mb-4" style="font-size: 0.95rem; max-width: 440px; margin-left: auto; margin-right: auto;">
        The page you are looking for doesn't exist, has been moved, or is under bespoke atelier tailoring.
      </p>

      <!-- 2 Buttons: Go Back & Back to Home -->
      <div class="d-flex flex-wrap gap-3 justify-content-center btn-container">
        <button onclick="history.back()" class="btn-404-primary" type="button">
          <i class="fa-solid fa-arrow-left"></i> Go Back
        </button>
        <a href="index.html" class="btn-404-secondary">
          <i class="fa-solid fa-house"></i> Back to Home
        </a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
